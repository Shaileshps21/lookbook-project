version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/lookbook
      JWT_SECRET: change_this_in_production
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      COOKIE_NAME: lookbook_token
    depends_on:
      - mongo

volumes:
  mongo_data:
